name: prek

on:
  push:
    branches: [main]
  pull_request:

jobs:
  prek:
    name: Run prek checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install the project
        run: uv sync --all-extras --dev
      - uses: j178/prek-action@v2.0.3
        with:
          extra_args: --all-files
